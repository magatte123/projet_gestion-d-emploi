<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/css/style.css"> 
    <link rel="stylesheet" href="public/css/sb-admin-2.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Connexion</h3>
        <form id="formConnexion">
            <div class="mb-3">
                <label for="mailConnexion" class="form-label">Email</label>
                <input id="mailConnexion" type="email" class="form-control" placeholder="Entrez votre Email">
            </div>
            <div class="mb-3">
                <label for="mdpConnexion" class="form-label">Mot de passe</label>
                <input id="mdpConnexion" type="password" class="form-control" placeholder="Entrez votre mot de passe">
            </div>
            <button type="submit" id="connexionButton" class="btn btn-primary w-100">Se connecter</button>
        </form>
        <div id="messageConnexion" class="mt-3 text-center"></div>
    </div>
    <script src="assets/js/app.js"></script>
    <script>
    document.getElementById('formConnexion').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Connexion réussie');
        // Redirection possible après connexion :
        // window.location.href = "page_accueil.html";
    });
    </script>
</body>
</html>
