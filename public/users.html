<!-- users.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des utilisateurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Animation de glissement */
        .slide-down {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.7s ease, opacity 0.7s ease;
        }
        .slide-down.show {
            max-height: 1000px;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">Liste des utilisateurs</h2>
        <div class="text-center mb-4">
            <button id="showTableBtn" class="btn btn-primary">Afficher la liste</button>
        </div>
        <div id="tableContainer" class="card shadow slide-down">
            <div class="card-body">
                <table id="usersTable" class="table table-striped table-bordered w-100">
                    <thead>
                        <tr class="table-primary">
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Les utilisateurs seront insérés ici dynamiquement -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script>
    fetch('http://localhost:3000/users')
        .then(res => res.json())
        .then(users => {
            const tbody = document.querySelector('#usersTable tbody');
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${u.id}</td><td>${u.name}</td><td>${u.email}</td>`;
                tbody.appendChild(tr);
            });
            $('#usersTable').DataTable({
                responsive: true,
                language: {
                    url: "//cdn.datatables.net/plug-ins/1.13.7/i18n/fr-FR.json"
                }
            });
        });

    document.getElementById('showTableBtn').addEventListener('click', () => {
        document.getElementById('tableContainer').classList.toggle('show');
    });
    </script>
</body>
</html>
