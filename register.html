<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/css/style.css"> 
    <link rel="stylesheet" href="public/css/sb-admin-2.css">
    <style>
        .sidebar {
            background: #0d6efd;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .sidebar h2 {
            margin-bottom: 1rem;
        }
        .form-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar bleue -->
            <div class="col-md-4 sidebar">
                <h2>Bienvenue !</h2>
                <p class="text-center">Créez votre compte pour accéder à la plateforme.</p>
            </div>
            <!-- Formulaire -->
            <div class="col-md-8 form-container">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Inscription</h3>
                    <form onsubmit="register(event)">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nom</label>
                            <input type="text" id="name" class="form-control" placeholder="Nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" id="password" class="form-control" placeholder="Mot de passe" required>
                        </div>
                        <button class="btn btn-primary w-100">S'inscrire</button>
                    </form>
                    <a href="public/users.html" class="btn btn-outline-primary w-100 mt-3">Voir la liste des utilisateurs</a>
                </div>
            </div>
        </div>
    </div>
    <script>
    function register(event) {
        event.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch('http://localhost:3000/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message || 'Inscription réussie');
        })
        .catch(() => alert('Erreur lors de l\'inscription'));
    }
    </script>
</body>
</html>
